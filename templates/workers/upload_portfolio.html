{% extends 'base.html' %}
{% block title %}Upload Portfolio - HandsToHope{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4">
                <h5 class="fw-bold mb-4" style="color:var(--blue)">
                    <i class="fas fa-camera me-2"></i>Upload Work Photo
                </h5>
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Work Photo <span class="text-danger">*</span></label>
                        {{ form.image }}
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Caption</label>
                        {{ form.caption }}
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-upload me-2"></i>Upload
                        </button>
                        <a href="{% url 'worker_dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
